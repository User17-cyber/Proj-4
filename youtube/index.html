<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Picks</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#111;color:#eee}
  input,textarea,button{font:inherit;padding:8px;margin:4px 0;width:100%;box-sizing:border-box;border-radius:6px;border:1px solid #444;background:#222;color:#eee}
  button{background:#e33;border:0;cursor:pointer}
  .v{display:flex;gap:12px;margin:12px 0}
  .v img{width:200px;max-width:40%;border-radius:6px;align-self:flex-start}
  a{color:#8cf;text-decoration:none} small{color:#999}
</style>
</head>
<body>
<h1>Fresh Picks</h1>
<small>Newest videos (last 14 days) from your creators, ranked by views per hour. <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">Get a free YouTube Data API key</a>.</small>
<input id="key" placeholder="YouTube Data API key">
<textarea id="who" rows="3" placeholder="Creators: @handles or channel IDs (UC…), comma or newline separated"></textarea>
<button id="go">Find videos</button>
<div id="out"></div>
<script>
const $ = id => document.getElementById(id), API = 'https://www.googleapis.com/youtube/v3/';
// localStorage keeps the key in this browser only; it is sent only to googleapis.com
$('key').value = localStorage.yk || ''; $('who').value = localStorage.yw || '';

async function api(path, params) {
  const r = await fetch(API + path + '?' + new URLSearchParams({...params, key: $('key').value.trim()}));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || r.status);
  return j;
}

// uploads playlist id = channel id with "UC" swapped for "UU"
async function uploadsFor(who) {
  if (/^UC[\w-]{22}$/.test(who)) return 'UU' + who.slice(2);
  const j = await api('channels', {part: 'contentDetails', forHandle: who.replace(/^@?/, '@')});
  if (!j.items?.length) throw new Error('Channel not found: ' + who);
  return j.items[0].contentDetails.relatedPlaylists.uploads;
}

async function run() {
  localStorage.yk = $('key').value; localStorage.yw = $('who').value;
  const out = $('out'); out.textContent = 'Loading…';
  const cutoff = Date.now() - 14 * 864e5, errs = [];
  const names = $('who').value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  const ids = (await Promise.all(names.map(async n => {
    try {
      const p = await uploadsFor(n);
      const j = await api('playlistItems', {part: 'contentDetails', playlistId: p, maxResults: 10});
      return j.items.filter(i => +new Date(i.contentDetails.videoPublishedAt) > cutoff).map(i => i.contentDetails.videoId);
    } catch (e) { errs.push(e.message); return []; }
  }))).flat();
  let vids = [];
  for (let i = 0; i < ids.length; i += 50) // videos.list takes max 50 ids
    vids.push(...(await api('videos', {part: 'snippet,statistics', id: ids.slice(i, i + 50).join(',')}).catch(e => (errs.push(e.message), {items: []}))).items);
  const rate = v => +(v.statistics.viewCount || 0) / Math.max((Date.now() - new Date(v.snippet.publishedAt)) / 36e5, 6); // 6h floor so brand-new uploads don't spike
  vids.sort((a, b) => rate(b) - rate(a));
  out.innerHTML = errs.map(e => `<p style="color:#f77"></p>`).join('');
  errs.forEach((e, i) => out.children[i].textContent = e);
  vids.forEach(v => {
    const d = document.createElement('div'); d.className = 'v';
    d.innerHTML = `<a><img></a><div><a class="t"></a><br><small></small></div>`;
    const url = 'https://www.youtube.com/watch?v=' + v.id;
    d.querySelectorAll('a').forEach(a => a.href = url);
    d.querySelector('img').src = v.snippet.thumbnails.medium.url;
    d.querySelector('.t').textContent = v.snippet.title;
    d.querySelector('small').textContent = `${v.snippet.channelTitle} · ${(+v.statistics.viewCount || 0).toLocaleString()} views · ${new Date(v.snippet.publishedAt).toLocaleDateString()}`;
    out.append(d);
  });
  if (!vids.length && !errs.length) out.textContent = 'Nothing new in the last 14 days.';
}
$('go').onclick = () => run().catch(e => $('out').textContent = e.message);
</script>
</body>
</html>
