<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Satchel: type what's due in one line and get a plan for tonight.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <title>Satchel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='9' width='24' height='19' rx='5' fill='%233b5bdb'/%3E%3Cpath d='M11 9V7a5 5 0 0 1 10 0v2' fill='none' stroke='%233b5bdb' stroke-width='3'/%3E%3Crect x='13' y='15' width='6' height='5' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="9" width="24" height="19" rx="5"/><path d="M11 9V7a5 5 0 0 1 10 0v2"/><rect class="clasp" x="13" y="15" width="6" height="5" rx="1.5"/></svg>
        <span>Satchel</span>
      </div>
      <form id="quick" class="quick" autocomplete="off">
        <label for="quick-input" class="sr-only">Add something</label>
        <input id="quick-input" type="text" placeholder="Add anything: “bio lab report due thu”" enterkeyhint="done">
        <button type="submit" class="btn primary">Add</button>
        <div id="quick-preview" class="quick-preview" aria-live="polite"></div>
      </form>
    </div>
    <nav class="tabs" aria-label="Views">
      <button data-view="today" class="active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Today</span>
      </button>
      <button data-view="tasks">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
        <span>Assignments</span>
      </button>
      <button data-view="week">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Week</span>
      </button>
      <button data-view="grades">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Grades</span>
      </button>
      <button data-view="classes">
        <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>
        <span>Classes</span>
      </button>
    </nav>
  </header>

  <main id="main"></main>

  <dialog id="dlg">
    <form id="dlg-form" method="dialog"></form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
